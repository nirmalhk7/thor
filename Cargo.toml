[package]
name = "thor"
version = "0.1.4"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(cargo_clippy)', 'cfg(devtools)'] }

[dependencies]
mimalloc = "0.1"
wgpu = "0.19"
glam = "0.25"
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
winit = "0.29"
libc = "0.2"
pollster = "0.3"
egui = "0.26"
egui-wgpu = "0.26"
egui-winit = "0.26"
tao = "0.30"
wry = "0.47"
serde_json = "1.0"
http = "1.1"
chromiumoxide = "0.9"
futures = "0.3"
thiserror = "2"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower = "0.5"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = "0.3"
subtle = "2.6"
base64 = "0.22"
zeroize = "1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
cef = { version = "=154.5.0", default-features = false, features = ["sandbox"], optional = true }

[features]
default = ["cef-runtime"]
cef-runtime = ["dep:cef", "dep:objc2-cef", "dep:objc2-app-kit", "dep:objc2-foundation"]
cef-check = ["cef-runtime", "cef/dox"]
cef-bundle = ["cef-runtime", "cef/build-util"]
legacy-wry = []

[lib]
name = "thor"
path = "src/lib.rs"

[[bin]]
name = "Thor"
path = "src/main.rs"

[[bin]]
name = "thor-labs"
path = "src/bin/thor_labs.rs"

[[bin]]
name = "thor-package"
path = "src/bin/package_thor.rs"
required-features = ["cef-bundle"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cmd_palette_bench"
harness = false

[[bench]]
name = "ipc_bench"
harness = false

[[bench]]
name = "cold_start_bench"
harness = false

[[bench]]
name = "memory_soak_bench"
harness = false

[[bench]]
name = "feature_sla_bench"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
objc2-cef = { package = "objc2", version = "0.6.3", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSEvent"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSObject"], optional = true }
objc2 = "0.5"
objc = "0.2"
cocoa = "0.26"
block = "0.1"
icrate = { version = "0.1", features = ["Foundation", "AppKit", "AppKit_NSMenu", "AppKit_NSMenuItem", "AppKit_NSApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
