name: Thor CI and Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (all branches)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install CEF build tools
        run: |
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            brew install cmake ninja
          fi
      - name: Test release version logic
        run: python3 -m unittest discover -s tests -p test_semantic_version.py
      - name: Check all Rust targets
        run: cargo check --locked --workspace --all-targets
      - name: Run all Rust tests
        # Several tests mutate process-wide THOR_DATA_DIR and AppState.
        run: cargo test --locked --workspace -- --test-threads=1

  release:
    name: Release CEF browser (main only)
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    concurrency:
      group: thor-release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify main still points at tested commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          git fetch origin main --tags
          if [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'main advanced; a newer run will release it'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Calculate semantic version
        id: semver
        if: steps.current.outputs.ready == 'true'
        run: python3 scripts/semantic_version.py --apply --github-output "$GITHUB_OUTPUT"
      - name: Check existing release
        id: existing
        if: steps.semver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install CEF build tools
        if: steps.existing.outputs.publish == 'true'
        run: |
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            brew install cmake ninja
          fi
      - name: Build and package Thor with embedded CEF
        if: steps.existing.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: ./scripts/package_macos.sh "$VERSION"
      - name: Verify release archives
        if: steps.existing.outputs.publish == 'true'
        run: shasum -a 256 -c dist/checksums.txt
      - name: Publish semantic version and GitHub release
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.semver.outputs.version }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- Cargo.toml Cargo.lock; then
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): bump version to $TAG [skip ci]"
          fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          gh release create "$TAG" \
            "dist/Thor-v${VERSION}-macos.zip" \
            "dist/Thor-v${VERSION}-macos.dmg" \
            dist/checksums.txt \
            --target "$(git rev-parse HEAD)" \
            --title "Thor Browser $TAG" \
            --generate-notes
