name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test_and_lint:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Browserless Privacy and Release Contract
        run: python3 scripts/privacy_regression_check.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable action, 2026-07-16
        with:
          toolchain: 1.97.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Cargo Check
        run: cargo check --workspace --all-targets

      - name: Library Unit Tests
        run: cargo test --lib

      - name: Integration Tests
        run: cargo test --test integration_tests

      - name: Browserless Privacy Tests
        run: cargo test --test privacy_browser_acceptance
